name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_ANALYTICS: 1

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      BREW_FORMULAS: mpv pkg-config ffmpeg
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/brew.tar
          key: brew-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ env.BREW_FORMULAS }}-${{ hashFiles('scripts/ci-brew.sh') }}
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: scripts/ci-brew.sh ~/brew.tar $BREW_FORMULAS
      - run: make test

  test-web:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BREW_FORMULAS: mpv pkg-config yt-dlp ffmpeg
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/brew.tar
          key: brew-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ env.BREW_FORMULAS }}-${{ hashFiles('scripts/ci-brew.sh') }}
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: scripts/ci-brew.sh ~/brew.tar $BREW_FORMULAS
      - run: make test-web
